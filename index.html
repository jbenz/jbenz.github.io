<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jbenz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #00e5ff;
      --accent2: #ff2d78;
      --bg: #050510;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Canvas particle field ── */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Radial glow pulse behind the card ── */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,255,.18) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      translate: -50% -50%;
      animation: pulse 4s ease-in-out infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: .6; }
      50%       { transform: scale(1.3); opacity: 1;  }
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 4rem 5rem;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,.04);
      animation: fadeUp .9s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; translate: 0 40px; }
      to   { opacity: 1; translate: 0 0;    }
    }

    /* ── Name ── */
    .name {
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: 1;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 70%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 6s linear infinite;
      background-size: 200% auto;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    /* ── Tagline ── */
    .tagline {
      margin-top: 1.2rem;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      font-weight: 400;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: rgba(255,255,255,.55);
      animation: fadeUp .9s .25s cubic-bezier(.22,1,.36,1) both;
    }

    /* ── Divider ── */
    .divider {
      width: 60px;
      height: 3px;
      margin: 2rem auto;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      animation: expandW 1s .5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes expandW {
      from { width: 0; opacity: 0; }
      to   { width: 60px; opacity: 1; }
    }

    /* ── Links ── */
    .links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp .9s .55s cubic-bezier(.22,1,.36,1) both;
    }

    .link {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .65rem 1.6rem;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,.15);
      color: rgba(255,255,255,.85);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .05em;
      transition: border-color .25s, color .25s, box-shadow .25s, translate .2s;
    }

    .link:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 20px rgba(0,229,255,.35);
      translate: 0 -3px;
    }

    .link svg { flex-shrink: 0; }

    /* ── Cursor glow that follows mouse ── */
    .cursor-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,45,120,.12) 0%, transparent 70%);
      pointer-events: none;
      translate: -50% -50%;
      z-index: 0;
      transition: top .08s, left .08s;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <div class="glow"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <main class="card">
    <h1 class="name">jbenz</h1>
    <p class="tagline">developer &nbsp;·&nbsp; builder &nbsp;·&nbsp; creator</p>
    <div class="divider"></div>
    <nav class="links">
      <a class="link" href="https://github.com/jbenz" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.484 2 12.021c0 4.428 2.865 8.184 6.839 9.504.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.342-3.369-1.342-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.004.07 1.532 1.032 1.532 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844a9.59 9.59 0 012.504.338c1.909-1.296 2.747-1.026 2.747-1.026.546 1.378.202 2.397.1 2.65.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.944.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.2 22 16.447 22 12.021 22 6.484 17.523 2 12 2z"/>
        </svg>
        GitHub
      </a>
      <a class="link" href="https://github.com/jbenz" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Contact
      </a>
    </nav>
  </main>

  <script>
    /* ── Particle canvas ── */
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    let W, H, particles;

    const PARTICLE_COUNT = 120;
    const MAX_DIST       = 140;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function mkParticle() {
      return {
        x:  Math.random() * W,
        y:  Math.random() * H,
        vx: (Math.random() - .5) * .4,
        vy: (Math.random() - .5) * .4,
        r:  Math.random() * 2 + 1,
      };
    }

    function init() {
      resize();
      particles = Array.from({ length: PARTICLE_COUNT }, mkParticle);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      /* move */
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;
      }

      /* connections */
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx   = particles[i].x - particles[j].x;
          const dy   = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < MAX_DIST) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(0,229,255,${(1 - dist / MAX_DIST) * .35})`;
            ctx.lineWidth   = .8;
            ctx.stroke();
          }
        }
      }

      /* dots */
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,229,255,.7)';
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); });
    init();
    draw();

    /* ── Cursor glow follow ── */
    const cursorGlow = document.getElementById('cursorGlow');
    window.addEventListener('mousemove', e => {
      cursorGlow.style.left = e.clientX + 'px';
      cursorGlow.style.top  = e.clientY + 'px';
    });
  </script>
</body>
</html>
